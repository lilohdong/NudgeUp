spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nudgeup}
    username: ${SPRING_DATASOURCE_USERNAME:nudgeup_user}
    password: ${SPRING_DATASOURCE_PASSWORD:yourpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:nudgeup-default-secret-key-for-development-only-change-in-prod}
  access-token-expiry: 3600000
  refresh-token-expiry: 1209600000

fcm:
  credentials-path: classpath:firebase-service-account.json
